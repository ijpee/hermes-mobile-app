name: Build updated Hermux APK

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  OPENUI_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  web:
    name: Build web interface
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and bundle web interface
        working-directory: web
        run: |
          npm ci
          npx vite build
      - uses: actions/upload-artifact@v6
        with:
          name: hermux-web-interface
          path: web/dist/index.html
          if-no-files-found: error
          retention-days: 1

  android:
    name: Build self-signed Android app
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v5
        with:
          name: hermux-web-interface
          path: web/dist
      - name: Install Android build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" >/dev/null
      - name: Build APK from checked-out sources
        env:
          HM_SKIP_WEB_BUILD: '1'
          VERSION_NAME: '0.8.67+unreleased'
          VERSION_CODE: '868'
        run: |
          KEYSTORE="$RUNNER_TEMP/hermux-selfbuild.keystore" bash android/build.sh
          test -s android/build/hermes-mobile.apk
      - uses: actions/upload-artifact@v6
        with:
          name: hermux-updated-apk
          path: android/build/hermes-mobile.apk
          if-no-files-found: error
          retention-days: 7
